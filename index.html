<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.ts-classic,.ts-skin{--tb:#f3e3b8;--tc:#3a2a10;--tr:#b79a5a;--rad:4px}
.ts-wood{--tb:linear-gradient(135deg,#dba96b,#b97d3f);--tc:#2b1a08;--tr:#8a5a28;--rad:4px}

#top{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-size:15px}
#top b{font-size:17px}
#vp{width:min(100vw,50dvh);aspect-ratio:1;overflow:hidden;position:relative;touch-action:none;background:#222}
#board{position:absolute;left:0;top:0;transform-origin:0 0;display:grid;--ts:38px;--z:1;
 --bg-plain:#fff0cc;--fg-plain:#fff;--bg-tw:#c00000;--fg-tw:#fff;--bg-dw:#ff6699;--fg-dw:#fff;--bg-tl:#0033cc;--fg-tl:#fff;--bg-dl:#5b9bd5;--fg-dl:#fff;--bg-st:#ff6699;--fg-st:#fff;--line:rgba(0,0,0,.18)}

.cell{position:relative;contain:layout style;width:40px;height:40px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.plain{background:var(--bg-plain)}
.tw{background:var(--bg-tw);color:var(--fg-tw)}.dw{background:var(--bg-dw);color:var(--fg-dw)}.tl{background:var(--bg-tl);color:var(--fg-tl)}.dl{background:var(--bg-dl);color:var(--fg-dl)}.st{background:var(--bg-st);color:var(--fg-st)}
.st .lb{font-size:22px}.lb.big{font-size:20px}

.cell .tile{border-width:2px;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 2px 3px rgba(0,0,0,.5)}
.cell .prev{opacity:.6;pointer-events:none;outline:none!important}

button{background:var(--pn);color:var(--tx);border:1px solid rgba(128,128,128,.35);min-height:48px;padding:11px 4px;border-radius:8px;font-size:14px;font-family:inherit}
button:active{filter:brightness(1.25)}
button:disabled{opacity:.4}
#bPlay{flex:2;background:var(--ac);color:#222;font-weight:700;border-color:transparent;font-size:15px}
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:20;opacity:.96;box-shadow:0 8px 14px rgba(0,0,0,.45);will-change:transform}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:10}
.ov.on{display:flex}
.box{background:var(--pn);color:var(--tx);padding:16px;border-radius:12px;width:min(94vw,380px);max-height:92dvh;overflow:auto;display:flex;flex-direction:column;gap:11px}

#letters{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}

#swapList{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px 0;--ts:44px}

#bagGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.bc{background:rgba(128,128,128,.22);border-radius:6px;text-align:center;padding:4px 0;font-size:13px}
.bc b{display:block;font-size:16px}.bc.z{opacity:.35}
.cell.cand{outline:2px dashed rgba(255,255,255,.9);outline-offset:-3px}
.pv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;background:rgba(0,0,0,.55);color:#fff;border-radius:8px;padding:0 4px;opacity:.8;font-size:max(10px,calc(8px/var(--z)));font-weight:700;line-height:1.25;pointer-events:none}
.pv.x{color:#ffb4b4}
.cell.tgt .pv{display:none}
.bd.g{background:#6b7280;opacity:.9}.bd.g.x{background:#9a4a4a}
.bd.cm{background:#e8590c}
.cell.cmp .tile{outline:3px solid #ff9f1a;box-shadow:0 0 10px 3px rgba(255,159,26,.85)}
.lite *{box-shadow:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){#board.anim{transition:none}}

<body class="th-slate ts-classic">
<div id="top"><b id="title">Bigword</b><span id="sc"></span><span id="bag"></span></div>
<div id="vp"><div id="board"></div></div>
<div id="status" role="status" aria-live="polite"></div>
<div id="rack"></div>
<div class="row"><button id="bPlay">Play</button><button id="bSwap">Swap</button><button id="bPass">Pass</button></div>
<div class="row"><button id="bShuffle">Shuffle</button><button id="bRecall">Recall</button><button id="bBag">Bag</button><button id="bFit">Fit</button><button id="bMenu">Menu</button></div>

<div class="ov" id="pick"><div class="box"><div>Blank tile: choose a letter</div><div id="letters"></div><button id="pickCancel">Cancel</button></div></div>

<div class="ov" id="swap"><div class="box"><div>Tap the tiles to swap</div><div id="swapList"></div><button id="swapGo">Swap selected</button><button id="swapCancel">Cancel</button></div></div>

<div class="ov" id="end"><div class="box"><b>Game over</b><div id="endTxt"></div><button id="endNew">New game</button><button id="endClose">Close</button></div></div>

<div class="ov" id="bagv"><div class="box"><b>Unseen tiles</b><small id="bagInfo"></small><div id="bagGrid"></div><button id="bagClose">Close</button></div></div>

<div class="ov" id="menu"><div class="box">
  <button id="mSet">Settings</button><button id="mStats">Scores and history</button>
  <button id="mNew">Cancel game and restart</button><button id="mClose">Close</button><small>Bigword build 7</small>
</div></div>

<div class="ov" id="stats"><div class="box"><b>Scores and history</b><div id="statBody"></div>
  <button id="statClear">Clear history</button><button id="statClose">Close</button></div></div>

<div class="ov" id="set"><div class="box">
  <h4>Game</h4>
  <label>Who plays first<select id="sFirst"><option value="random">Random</option><option value="me">Me</option><option value="computer">Computer</option><option value="alternate">Take turns each game</option></select></label>
  <label>Computer level<select id="sLevel"><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></label>
  <label class="ck"><input type="checkbox" id="sRare"> Computer avoids rare and obscene words</label>
  <h4>Help my luck</h4>
  <label class="ck"><input type="checkbox" id="hBal"> Balance vowels and consonants</label>
  <label class="ck"><input type="checkbox" id="hDup"> Avoid duplicate letters</label>
  <label class="ck"><input type="checkbox" id="hHard"> Avoid awkward tiles (Q without U, J Q X Z V together)</label>
  <label class="ck"><input type="checkbox" id="sBagOn"> Allow viewing unseen tiles (Bag button)</label>
  <h4>Look and feel</h4>
  <label>Board skin<select id="sSkin"></select></label>
  <label>Zoom when holding a tile over the board<select id="sDz"><option value="off">Off</option><option value="low">Low</option><option value="med">Medium</option><option value="high">High</option></select></label>
  <label>Tile size (10 = standard)<input type="range" id="sSize" min="6" max="16" step="1"></label>
  <label>Letter size<input type="range" id="sLsz" min="80" max="150" step="5"></label>
  <label>Points size<input type="range" id="sPsz" min="70" max="170" step="10"></label>
  <label class="ck"><input type="checkbox" id="sHap"> Vibration feedback</label>
  <label class="ck"><input type="checkbox" id="sLite"> Low-end mode (no shadows, previews or animations)</label>
  <label>Theme<select id="sTheme"><option value="slate">Slate</option><option value="midnight">Midnight</option><option value="forest">Forest</option><option value="berry">Berry</option><option value="light">Light</option></select></label>
  <label>Tile style<select id="sTiles"><option value="classic">Classic ivory</option><option value="wood">Wood</option><option value="white">White</option><option value="dark">Dark</option><option value="clean">Clean</option><option value="skin">Skin default</option></select></label>
  <h4>Word list</h4>
  <label><input type="file" id="sFile" accept=".txt"></label>
  <small id="dictInfo"></small>
  <button id="sBuiltin">Use built-in ENABLE list</button>
  <button id="sClose">Close</button>
</div></div>

<script src="config.js"></script>
<script src="dev.js"></script>
<script>
const C = window.CONFIG, N = C.board.length, CELL = 40, BS = N * CELL, MID = N >> 1;
C.luck = Object.assign({ pairs: 0, pairChance: 10, vmin: 3, vmax: 4, vowelPct: 44, tierW: [1, 1, 1, 1], maxHigh: 8 }, C.luck || {});
C.dev = Object.assign({ confirmRestart: false, noSBlank: false }, C.dev || {});
C.tiers = C.tiers || { R: 1, S: 1, T: 1, N: 1, E: 1, A: 1, D: 2, G: 2, I: 2, L: 2, O: 2, U: 2, C: 2, M: 2, H: 2, B: 3, F: 3, P: 3, W: 3, Y: 3, K: 3, V: 3, J: 4, X: 4, Q: 4, Z: 4 };
const ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', VOW = 'AEIOU', DZ = { off: 0, low: .9, med: 1.15, high: 1.4 };
const $ = id => document.getElementById(id);
const vp = $('vp'), board = $('board');
let S = { theme: 'slate', tiles: 'classic', size: 10, noRare: true, hBal: true, hDup: true, hHard: true, showBag: true,
          level: 'hard', first: 'random', lastFirst: 'computer', dz: 'med', skin: 'classic', lsz: 100, psz: 100, haptic: true, lite: false };
let G = null, selected = -1, busy = true, cur = null, msg = '', HL = null;
let view = { s: 1, x: 0, y: 0 }, fit = 1;
let W = new Set(), COMMON = new Set(), BAD = new Set(), root = {}, ownDict = false;
let SKIN = {}, SKINS = [{ id: 'classic', name: 'Classic' }];
const cells = [];
document.title = C.name; $('title').textContent = C.name;

const status = m => { $('status').textContent = m; };
const shuf = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const save = () => { try { localStorage.setItem('bigword', JSON.stringify({ S, G })); } catch (e) {} };
function load() {
  try {
    const d = JSON.parse(localStorage.getItem('bigword'));
    if (d) { Object.assign(S, d.S); if (d.G && d.G.board && d.G.rack.length === C.rackSize) { G = d.G; if (!G.st) G.st = { bingos: [0, 0], best: [['', 0], ['', 0]] }; } }
  } catch (e) {}
}
const idb = fn => new Promise((res, rej) => {
  const q = indexedDB.open('bigword', 1);
  q.onupgradeneeded = () => q.result.createObjectStore('k');
  q.onsuccess = () => { const r = fn(q.result.transaction('k', 'readwrite').objectStore('k')); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); };
  q.onerror = () => rej(q.error);
});

// ---------- dictionary ----------
function buildTrie(words) {
  const r = {};
  for (const w of words) { let n = r; for (let i = 0; i < w.length; i++) n = n[w[i]] || (n[w[i]] = {}); n.$ = 1; }
  return r;
}
async function loadDict() {
  busy = true; status('Loading dictionary...');
  let txt = null; try { txt = await idb(s => s.get('dict')); } catch (e) {}
  ownDict = !!txt;
  try {
    const [a, b, c] = await Promise.all([
      ownDict ? txt : fetch('enable.txt').then(r => r.text()),
      fetch('common.txt').then(r => r.text()).catch(() => ''),
      fetch('bad.txt').then(r => r.text()).catch(() => '')]);
    await new Promise(r => setTimeout(r, 30));
    const words = a.split(/\s+/).map(w => w.toUpperCase()).filter(w => /^[A-Z]{2,17}$/.test(w));
    W = new Set(words); root = buildTrie(words);
    COMMON = new Set(b.toUpperCase().split(/\s+/)); BAD = new Set(c.toUpperCase().split(/\s+/));
    msg = 'Loaded ' + words.length.toLocaleString() + ' words' + (ownDict ? ' (your list).' : ' (ENABLE).');
    $('dictInfo').textContent = msg;
  } catch (e) { msg = 'Could not load the word list.'; status(msg); return; }
  busy = false;
  if (G.over) $('end').classList.add('on');
  if (G.turn === 1 && !G.over) computerTurn(); else refresh();
}

// ---------- game state ----------
function newGame() {
  const bag = [];
  for (const ch in C.bag) for (let i = 0; i < C.bag[ch]; i++) bag.push(ch);
  let f = S.first;
  if (f === 'random') f = Math.random() < .5 ? 'me' : 'computer';
  else if (f === 'alternate') f = S.lastFirst === 'me' ? 'computer' : 'me';
  S.lastFirst = f;
  G = { bag: shuf(bag), rack: Array(C.rackSize).fill(null), crack: [], placed: [], scores: [0, 0], turn: f === 'me' ? 0 : 1, first: f,
        passes: 0, over: false, last: [], st: { bingos: [0, 0], best: [['', 0], ['', 0]] },
        board: Array.from({ length: N }, () => Array(N).fill(null)) };
  // test variation: only the player who goes first gets one blank and no S in the first rack
  const T = C.dev.noSBlank, meFirst = T && f === 'me', cpuFirst = T && f === 'computer';
  const blank = () => { const i = G.bag.indexOf('?'); return i >= 0 ? G.bag.splice(i, 1)[0] : null; };
  const noS = () => { const ix = []; G.bag.forEach((ch, i) => { if (ch !== 'S') ix.push(i); }); return ix.length ? G.bag.splice(ix[Math.random() * ix.length | 0], 1)[0] : null; };
  if (meFirst) { const hb = blank(); if (hb) G.rack[0] = { ch: hb }; }
  for (let i = 0; i < C.rackSize; i++) if (!G.rack[i]) { const t = drawHuman(meFirst ? 'S' : undefined); if (t) G.rack[i] = t; }
  if (cpuFirst) { const cb = blank(); if (cb) G.crack.push({ ch: cb }); }
  while (G.crack.length < C.rackSize) { const ch = cpuFirst ? noS() : G.bag.pop(); if (!ch) break; G.crack.push({ ch }); }
  selected = -1; msg = 'New game. ' + (f === 'me' ? 'You start.' : 'Computer starts.');
}
// Picks one tile for the player's rack. tiles = tiles already in the rack, left = slots still to fill after this one,
// f = {dup, bal, hard} switches, L = luck settings, ex = letters never to pick. Rules are relaxed in steps only if nothing fits.
function pickTile(bag, tiles, left, f, L, ex) {
  const T = C.tiers || {}, tier = ch => T[ch] || 2, isV = ch => VOW.includes(ch);
  const cnt = {}; bag.forEach(ch => { cnt[ch] = (cnt[ch] || 0) + 1; });
  let v = 0, b = 0, hard = 0, hasU = 0, high = 0; const have = {};
  tiles.forEach(t => {
    if (t.ch === '?') { b++; hasU = 1; return; }
    have[t.ch] = (have[t.ch] || 0) + 1;
    if (isV(t.ch)) v++;
    if ('JQXZV'.includes(t.ch)) hard++;
    if (t.ch === 'U') hasU = 1;
    if (tier(t.ch) >= 3) high++;
  });
  const on = f.dup || f.bal || f.hard;
  const pairs = Object.values(have).filter(x => x === 2).length;
  const extra = Math.random() * 100 < (L.pairChance || 0) ? 1 : 0;   // sometimes allow one pair
  const ok = (ch, lv) => {   // lv 0 = all rules, 1 = drop awkward, 2 = also relax pairs and balance, 3 = anything
    if (ex && ex.includes(ch)) return false;
    if (lv >= 3 || ch === '?') return true;
    const h = have[ch] || 0;
    if (f.dup) { if (h >= 2) return false; if (h === 1 && pairs >= L.pairs + extra + (lv >= 2 ? 1 : 0)) return false; }
    if (f.hard && lv < 1) {
      if ('JQXZV'.includes(ch) && hard >= 1) return false;
      if (ch === 'Q' && !hasU) return false;
      if (tier(ch) >= 3 && high >= (L.maxHigh || 8)) return false;
    }
    if (f.bal && lv < 2) { const nv = v + (isV(ch) ? 1 : 0); if (nv > L.vmax || nv + b + left < L.vmin) return false; }
    return true;
  };
  for (let lv = 0; lv < 4; lv++) {
    const c = Object.keys(cnt).filter(ch => ok(ch, lv));
    if (!c.length) continue;
    let pool = c;
    if (f.bal && L.vowelPct > 0) {   // soft pull toward the target vowel share
      const need = L.vowelPct / 100 * C.rackSize - (v + .5 * b), p = Math.min(.95, Math.max(.05, need / (left + 1)));
      pool = Math.random() < p ? c.filter(isV) : c.filter(ch => !isV(ch));
      if (!pool.length) pool = c;
    }
    const w = ch => cnt[ch] * (on && ch !== '?' ? ((L.tierW || [])[tier(ch) - 1] ?? 1) : 1);
    const pw = pool.filter(ch => w(ch) > 0); if (pw.length) pool = pw;
    let x = Math.random() * pool.reduce((s, ch) => s + w(ch), 0);
    for (const ch of pool) { x -= w(ch); if (x < 0) return ch; }
    return pool[pool.length - 1];
  }
  return bag.find(ch => !(ex && ex.includes(ch))) ?? null;
}
const luckFlags = () => ({ dup: S.hDup, bal: S.hBal, hard: S.hHard });
window.BW = { pickTile, luckFlags };
function drawHuman(ex) {
  if (!G.bag.length) return null;
  const tiles = G.rack.filter(Boolean), left = G.rack.filter(x => !x).length - 1;
  const ch = pickTile(G.bag, tiles, left, luckFlags(), C.luck, ex);
  if (ch == null) return null;
  G.bag.splice(G.bag.indexOf(ch), 1); return { ch };
}
function refillHuman() { for (let i = 0; i < C.rackSize; i++) if (!G.rack[i]) { const t = drawHuman(); if (t) G.rack[i] = t; } }

// ---------- scoring ----------
const pcells = () => G.placed.map(p => ({ r: p.r, c: p.c, ch: p.t.ch === '?' ? p.t.as : p.t.ch, bl: p.t.ch === '?' }));
function evalMove(cs) {
  const set = new Map(); cs.forEach(t => set.set(t.r * N + t.c, t));
  const rows = new Set(cs.map(t => t.r)), cols = new Set(cs.map(t => t.c));
  if (rows.size > 1 && cols.size > 1) return { err: 'Tiles must be in one line.' };
  const at = (r, c) => (r < 0 || c < 0 || r >= N || c >= N) ? null : (set.get(r * N + c) || G.board[r][c]);
  const line = (r, c, dr, dc) => {
    while (at(r - dr, c - dc)) { r -= dr; c -= dc; }
    const l = []; while (at(r, c)) { l.push([r, c]); r += dr; c += dc; } return l;
  };
  const lines = [];
  if (cs.length > 1) {
    const horiz = rows.size === 1, d = horiz ? [0, 1] : [1, 0];
    const main = line(cs[0].r, cs[0].c, d[0], d[1]);
    if (main.filter(p => set.has(p[0] * N + p[1])).length !== cs.length) return { err: 'No gaps allowed between tiles.' };
    lines.push(main);

$('sBuiltin').onclick = async () => { await idb(s => s.delete('dict')); $('set').classList.remove('on'); await loadDict(); status(msg); };
$('endNew').onclick = startNew;
$('endClose').onclick = () => $('end').classList.remove('on');
function applySettings() {
  const b = document.body; b.className = 'th-' + S.theme + ' ts-' + S.tiles + (S.lite ? ' lite' : '');
  ['--tb', '--tc', '--tr', '--rad'].forEach(p => b.style.removeProperty(p));
  b.style.setProperty('--lsz', S.lsz / 100); b.style.setProperty('--psz', S.psz / 100);
  if (S.tiles === 'skin' && SKIN.tile) {
    b.style.setProperty('--tb', SKIN.tile.bg); b.style.setProperty('--tc', SKIN.tile.fg);
    b.style.setProperty('--tr', SKIN.tile.border); b.style.setProperty('--rad', SKIN.tile.radius || '4px');
  }
  $('bBag').style.display = S.showBag ? '' : 'none';
  document.querySelector('meta[name=theme-color]').content = getComputedStyle(b).getPropertyValue('--bg').trim() || '#2b3038';
  sizes();
}
window.addEventListener('resize', () => {
  const was = view.s <= fit * 1.01; fit = vp.clientWidth / BS;
  if (was) view.s = fit; view.s = Math.max(view.s, fit); sizes(); apply();
});

// ---------- start ----------
load(); applySettings(); buildBoard();
fit = vp.clientWidth / BS; view.s = fit; apply();
if (!G) newGame();
render(); evaluate();
loadSkins(); loadDict();
if ('serviceWorker' in navigator) {
  const had = navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had) location.reload(); });
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
