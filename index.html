<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#252D38">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Bigword</title>
<style>
@font-face{font-family:'BWTile';src:url(fonts/tile.woff2) format('woff2');font-weight:800;font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{--tfont:'BWTile','Montserrat','Segoe UI',system-ui,sans-serif;
 --cell:#F6E5C4;--ln:#a98f66;--frame:#8A593A;--tray:#1C2633;--b-tw:#BA182C;--b-dw:#ED5986;--b-tl:#0648B8;--b-dl:#559DD5;
 font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);display:flex;justify-content:center;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.th-slate{--bg:#252D38;--pn:#202936;--tx:#F3F5F8;--mu:#AAB3C0;--bd:#3D4B5C;--ac:#F5B83E;--ac2:#74B8F1;--tray:#1C2633}
.th-midnight{--bg:#0e1424;--pn:#1c2742;--tx:#e3e8f5;--mu:#9aa6c4;--bd:#2d3b61;--ac:#6ea8ff;--ac2:#9cc4ff;--tray:#101a33}
.th-forest{--bg:#16261c;--pn:#24402e;--tx:#e4f0e6;--mu:#9fb8a5;--bd:#365a43;--ac:#c9e265;--ac2:#a3d977;--tray:#0f1d14}
.th-berry{--bg:#2a1626;--pn:#46233f;--tx:#f5e6f1;--mu:#c9a4be;--bd:#6a3a60;--ac:#ff8fc1;--ac2:#ffb3d6;--tray:#1e0f1b}
.th-light{--bg:#FAF9F6;--pn:#ffffff;--tx:#20232A;--mu:#737985;--bd:#E6E0D7;--ac:#F6B93F;--ac2:#3478DF;--cell:#F8F0DF;--ln:#d8cbb0;--frame:#EFE1CD;--tray:#E3C99C;--b-tw:#E54C51;--b-dw:#F17E9C;--b-tl:#2675D9;--b-dl:#82BDEA}
.ts-classic,.ts-skin{--tf1:#FBE2B0;--tf2:#F2CB88;--th:#FFEBC5;--te:#CA935A;--tk:#292015;--rx:10px}
.ts-honey{--tf1:#F5D09C;--tf2:#E6B374;--th:#FFE2AC;--te:#A96A39;--tk:#24170F;--rx:10px}
.ts-white{--tf1:#ffffff;--tf2:#ececec;--th:#ffffff;--te:#a8a8a8;--tk:#222;--rx:10px}
.ts-dark{--tf1:#2f3745;--tf2:#1b212b;--th:#7285a3;--te:#0b0e13;--tk:#ffffff;--rx:10px}
.ts-clean{--tf1:#fbfbfd;--tf2:#f0f0f5;--th:#ffffff;--te:#c9c9d3;--tk:#333;--rx:16px}
.fin-wood{--grain:.38}
#app{width:min(100vw,560px);height:100%;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 8px;overflow:hidden}
#top{width:100%;display:flex;align-items:center;gap:10px;background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:5px 10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
#logo{width:30px;flex:none}
#title{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:20px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc{text-align:center;line-height:1.05;font-size:11px;color:var(--mu)}
.sc b{display:block;font-size:20px;color:var(--ac)}
.th-light .sc b{color:var(--tx)}
#bagi{display:flex;align-items:center;gap:4px;font-size:15px;font-weight:700}
#bagi svg{width:22px;height:22px}
#bw{width:min(100%,calc(100dvh - 400px));min-width:250px;padding:9px;border-radius:14px;background:var(--frame);box-shadow:inset 0 0 0 2px rgba(255,255,255,.22),inset 0 -3px 0 rgba(0,0,0,.2),0 6px 14px rgba(0,0,0,.28);flex:none}
body.noscr #bw{width:min(100%,calc(100dvh - 300px))}
#vp{width:100%;aspect-ratio:1;overflow:hidden;position:relative;touch-action:none;background:#222;border-radius:3px}
#board,.mbd{position:absolute;left:0;top:0;transform-origin:0 0;display:grid;--z:1;
 --bg-plain:var(--cell);--fg-plain:#fff;--bg-tw:var(--b-tw);--fg-tw:#fff;--bg-dw:var(--b-dw);--fg-dw:#fff;--bg-tl:var(--b-tl);--fg-tl:#fff;--bg-dl:var(--b-dl);--fg-dl:#fff;--bg-st:var(--b-dw);--fg-st:#fff;--line:var(--ln)}
#board.anim{transition:transform .22s ease}
.cell{position:relative;contain:layout style;width:40px;height:40px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.plain{background:var(--bg-plain)}
.tw{background:var(--bg-tw);color:var(--fg-tw)}.dw{background:var(--bg-dw);color:var(--fg-dw)}.tl{background:var(--bg-tl);color:var(--fg-tl)}.dl{background:var(--bg-dl);color:var(--fg-dl)}.st{background:var(--bg-st);color:var(--fg-st)}
.lb.big{font-size:20px}
.sy{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;background:rgba(255,255,255,.92);pointer-events:none}
.sy.d{transform:rotate(45deg);width:9px;height:9px;margin:-4.5px 0 0 -4.5px}.sy.c{border-radius:50%}
.star{position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;pointer-events:none}
.im{position:absolute;left:4px;top:3px;width:32px;height:32px;object-fit:contain;pointer-events:none}
.mk{position:absolute;right:2px;bottom:0;font-size:9px;font-weight:800;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000;pointer-events:none}
.cell.has>.lb,.cell.has>.im,.cell.has>.mk,.cell.has>.sy,.cell.has>.star{display:none}
.cell.tgt{outline:3px solid #fff;outline-offset:-3px;z-index:2;box-shadow:inset 0 0 0 4px rgba(0,0,0,.45)}
.cell.cand{outline:2px dashed rgba(255,255,255,.9);outline-offset:-3px}
.cell.cmp .tile{outline:3px solid #ff9f1a;outline-offset:-1px;border-radius:9px}
.cell.last .tile{outline:2px solid #2e8bff;outline-offset:-1px;border-radius:9px}
.cell .tile{width:37px;height:37px}
.cell .tile.new{outline:2px solid #ffd54a;outline-offset:-1px;border-radius:9px}
.cell .prev{opacity:.62;pointer-events:none}
/* tiles: one SVG design used everywhere */
.tile{display:block;position:relative;width:100%;aspect-ratio:1;touch-action:none}
.tile svg{display:block;width:100%;height:100%;overflow:visible;pointer-events:none}
.tile .L{font-family:var(--tfont);font-weight:800;font-size:calc(58px*var(--lsz,1));fill:var(--tk)}
.tile .P{font-family:var(--tfont);font-weight:800;font-size:calc(19px*var(--psz,1));fill:var(--tk);opacity:.92}
.tile.blank .L{fill:#b03a2e}
.tile.sel{transform:translateY(-6px);outline:3px solid var(--ac2);outline-offset:-1px;border-radius:10px}
.tile.lifted{opacity:.3}
.tile.faded svg{opacity:.2}
.tile.faded{outline:1px dashed rgba(170,170,170,.6);outline-offset:-1px;border-radius:10px}
.tile.unm{--tf1:#ffe3e3;--tf2:#f7c4c4;--te:#d97b7b;--th:#fff;--tk:#8a2b2b;outline:2px dashed #d97b7b;outline-offset:-2px;border-radius:10px}
.bd{position:absolute;left:-3px;top:-8px;z-index:3;background:#0a57c2;color:#fff;border-radius:9px;padding:1px 5px;font-size:max(11px,calc(9px/var(--z)));font-weight:700;line-height:1.2;pointer-events:none}
.bd.x{background:#d32f2f}.bd.g{background:#6b7280;opacity:.9}.bd.g.x{background:#9a4a4a}.bd.cm{background:#e8590c}
.pv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;background:rgba(0,0,0,.55);color:#fff;border-radius:8px;padding:0 4px;opacity:.8;font-size:max(10px,calc(8px/var(--z)));font-weight:700;line-height:1.25;pointer-events:none}
.pv.x{color:#ffb4b4}
.cell.tgt .pv{display:none}
#bar{width:100%;display:flex;align-items:center;gap:6px;flex:none}
#status{flex:1;min-height:38px;font-size:13px;line-height:1.3;padding:2px 4px;display:flex;align-items:center}
#bDir{min-height:38px;min-width:92px;font-size:12.5px;padding:4px 8px}
#tray{width:100%;background:var(--tray);border-radius:14px;padding:6px;box-shadow:inset 0 2px 6px rgba(0,0,0,.4),0 0 0 1px var(--bd);flex:none}
.th-light #tray{background:linear-gradient(#ead3a8,#d3b480);box-shadow:inset 0 2px 5px rgba(120,80,30,.35),0 0 0 1px #c9a870}
#tray.hot{outline:3px solid var(--ac2)}
#rack{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;touch-action:none}
.slot{aspect-ratio:1;border-radius:10px;background:rgba(0,0,0,.2)}
.th-light .slot{background:rgba(110,70,20,.14)}
.slot.ts{outline:3px solid var(--ac2);outline-offset:-1px}
#scr{width:100%;background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:6px 8px 6px;box-shadow:0 2px 8px rgba(0,0,0,.18);flex:none}
#scr .sh{display:flex;align-items:center;gap:6px;margin-bottom:5px}
#scr .sh b{font-size:13px;flex:1}
#scr .sh button,#scGrip{min-height:32px;padding:3px 10px;font-size:12px}
#scrow{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;touch-action:none}
.sslot{aspect-ratio:1;border-radius:8px;border:1.5px dashed rgba(128,128,128,.5)}
.sslot.f{border-color:transparent}
.sslot.ts{outline:3px solid var(--ac2);outline-offset:-1px}
#sfb{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:12.5px;min-height:34px}
#sfb .t{flex:1;line-height:1.25}
.ok{color:#2e9d5b}.no{color:#e0524f}.warn{color:#d98a1c}.mu{color:var(--mu)}
.th-light .ok{color:#1f8a4c}
.row{display:flex;gap:6px;width:100%;justify-content:center;flex:none}
.row button{flex:1;min-width:0}
button{background:var(--pn);color:var(--tx);border:1px solid var(--bd);min-height:46px;padding:6px 4px;border-radius:10px;font-size:13px;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 1px 3px rgba(0,0,0,.18)}
button:active{filter:brightness(1.2)}
button:disabled{opacity:.4}
button svg{width:18px;height:18px;flex:none}
.row.r2 button{flex-direction:column;gap:2px;font-size:11px;min-height:48px}
#bPlay{flex:1.6;background:var(--ac);color:#2a1d05;font-weight:700;border-color:transparent;font-size:15px}
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:20;opacity:.96;will-change:transform}
.ghost .tile,.tile.ghost{filter:drop-shadow(0 7px 5px rgba(0,0,0,.45))}
#scGrip{touch-action:none}
.wg{display:flex;gap:2px}.wg.dn{flex-direction:column}
#mag{position:fixed;z-index:30;width:128px;height:128px;border-radius:50%;overflow:hidden;border:3px solid var(--ac);box-shadow:0 4px 12px rgba(0,0,0,.5);display:none;pointer-events:none;background:#222}
#magIn{position:absolute;left:0;top:0;transform-origin:0 0}
#magX{position:absolute;left:44px;top:44px;width:40px;height:40px;border:2px solid #fff;box-shadow:0 0 0 1px #000;border-radius:4px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:40}
.ov.on{display:flex}
.box{background:var(--pn);color:var(--tx);padding:16px;border-radius:12px;width:min(94vw,380px);max-height:92dvh;overflow:auto;display:flex;flex-direction:column;gap:11px}
.box label{display:flex;flex-direction:column;gap:4px;font-size:14px}
.box label.ck{flex-direction:row;align-items:center;gap:10px}
.box select,.box input[type=range]{font-size:16px;padding:6px;font-family:inherit}
.box small{opacity:.75;font-size:12px}
.box h4{margin:6px 0 0;font-size:13px;opacity:.8;text-transform:uppercase;letter-spacing:.05em}
.box td{padding:3px 6px;font-size:14px}.box table{border-collapse:collapse;width:100%}
#letters{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
#letters button{padding:10px 0}
#swapList{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 0;width:230px;margin:0 auto}
#swapList .tile.sel{transform:translateY(-4px)}
#bagGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.bc{background:rgba(128,128,128,.22);border-radius:6px;text-align:center;padding:4px 0;font-size:13px}
.bc b{display:block;font-size:16px}.bc.z{opacity:.35}
.lite *{box-shadow:none!important;transition:none!important;filter:none!important}
@media (prefers-reduced-motion:reduce){#board.anim{transition:none}}
</style>
</head>
<body class="th-slate ts-classic fin-smooth">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
 <linearGradient id="gF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--tf1)"/><stop offset="1" style="stop-color:var(--tf2)"/></linearGradient>
 <pattern id="gG" width="16" height="100" patternUnits="userSpaceOnUse" patternTransform="rotate(7)"><path d="M2 0V100M6 0V100M11 0V100M14 0V100" stroke="#7a4a1c" stroke-width=".9" opacity=".55"/></pattern>
 <symbol id="tb" viewBox="0 0 100 100">
  <rect x="3" y="8" width="96" height="91" rx="11" fill="#000" opacity=".22"/>
  <rect x="2" y="6" width="96" height="92" rx="11" style="fill:var(--te)"/>
  <rect x="2" y="2" width="96" height="91" style="rx:var(--rx,10px);ry:var(--rx,10px)" fill="url(#gF)"/>
  <rect x="2" y="2" width="96" height="91" style="rx:var(--rx,10px);ry:var(--rx,10px);opacity:var(--grain,0)" fill="url(#gG)"/>
  <rect x="4" y="4" width="92" height="87" style="rx:var(--rx,10px);ry:var(--rx,10px);stroke:var(--th)" fill="none" stroke-width="3" opacity=".75"/>
 </symbol>
</defs></svg>
<div id="app">
<div id="top"><div id="logo"></div><div id="title">Bigword</div>
  <div class="sc"><span>You</span><b id="s0">0</b></div><div class="sc"><span>Computer</span><b id="s1">0</b></div>
  <div id="bagi"><span id="bagic"></span><span id="bagn">0</span></div></div>
<div id="bw"><div id="vp"><div id="board"></div></div></div>
<div id="bar"><div id="status" role="status" aria-live="polite"></div><button id="bDir"></button></div>
<div id="tray"><div id="rack"></div></div>
<div id="scr">
  <div class="sh"><b>Scratch row</b><button id="scPaste">Paste</button><button id="scClr">Clear</button><button id="scGrip">Drag word to board</button></div>
  <div id="scrow"></div>
  <div id="sfb"></div>
</div>
<div class="row"><button id="bPlay"><i data-i="play"></i><span id="bPlayT">Play</span></button><button id="bSwap"><i data-i="swap"></i>Swap</button><button id="bPass"><i data-i="pass"></i>Pass</button></div>
<div class="row r2"><button id="bShuffle"><i data-i="shuffle"></i>Shuffle</button><button id="bRecall"><i data-i="recall"></i>Recall</button><button id="bBag"><i data-i="bag"></i>Bag</button><button id="bFit"><i data-i="fit"></i>Fit</button><button id="bMenu"><i data-i="menu"></i>Menu</button></div>
</div>
<div id="mag"><div id="magIn"></div><div id="magX"></div></div>

<div class="ov" id="pick"><div class="box"><div>Blank tile: choose a letter</div><div id="letters"></div><button id="pickCancel">Cancel</button></div></div>

<div class="ov" id="swap"><div class="box"><div>Tap the tiles to swap</div><div id="swapList"></div><button id="swapGo">Swap selected</button><button id="swapCancel">Cancel</button></div></div>

<div class="ov" id="end"><div class="box"><b>Game over</b><div id="endTxt"></div><button id="endNew">New game</button><button id="endClose">Close</button></div></div>

<div class="ov" id="bagv"><div class="box"><b>Unseen tiles</b><small id="bagInfo"></small><div id="bagGrid"></div><button id="bagClose">Close</button></div></div>

<div class="ov" id="menu"><div class="box">
  <button id="mSimP" style="display:none">Pause simulation</button><button id="mSimS" style="display:none">Stop simulation</button>
  <button id="mSet">Settings</button><button id="mStats">Scores and history</button>
  <button id="mNew">Cancel game and restart</button><button id="mClose">Close</button><small>Bigword build 8</small>
</div></div>

<div class="ov" id="stats"><div class="box"><b>Scores and history</b><div id="statBody"></div>
  <button id="statClear">Clear history</button><button id="statClose">Close</button></div></div>

<div class="ov" id="set"><div class="box">
  <h4>Game</h4>
  <label>Who plays first<select id="sFirst"><option value="random">Random</option><option value="me">Me</option><option value="computer">Computer</option><option value="alternate">Take turns each game</option></select></label>
  <label>Computer level<select id="sLevel"><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></label>
  <label class="ck"><input type="checkbox" id="sRare"> Computer avoids rare and obscene words</label>
  <h4>Help my luck</h4>
  <label class="ck"><input type="checkbox" id="hBal"> Balance vowels and consonants</label>
  <label class="ck"><input type="checkbox" id="hDup"> Avoid duplicate letters</label>
  <label class="ck"><input type="checkbox" id="hHard"> Avoid awkward tiles (Q without U, J Q X Z V together)</label>
  <label class="ck"><input type="checkbox" id="sBagOn"> Allow viewing unseen tiles (Bag button)</label>
  <h4>Scratch row (helps you)</h4>
  <label class="ck"><input type="checkbox" id="sScr"> Show the scratch row (word check and face points)</label>
  <label class="ck"><input type="checkbox" id="sBest"> Also show the best score the word could make on the board</label>
  <h4>Look and feel</h4>
  <label>Board skin<select id="sSkin"></select></label>
  <label>Zoom after the first tile is dropped<select id="sDz"><option value="off">Off</option><option value="low">Low</option><option value="med">Medium</option><option value="high">High</option></select></label>
  <label>Letter size<input type="range" id="sLsz" min="80" max="150" step="5"></label>
  <label>Points size<input type="range" id="sPsz" min="70" max="170" step="10"></label>
  <label class="ck"><input type="checkbox" id="sHap"> Vibration feedback</label>
  <label class="ck"><input type="checkbox" id="sLite"> Low-end mode (no shadows, previews or animations)</label>
  <label>Theme<select id="sTheme"><option value="slate">Dark (slate)</option><option value="light">Light</option><option value="midnight">Midnight</option><option value="forest">Forest</option><option value="berry">Berry</option></select></label>
  <label>Tile colour<select id="sTiles"><option value="classic">Natural</option><option value="honey">Honey</option><option value="white">White</option><option value="dark">Dark</option><option value="clean">Clean</option><option value="skin">Skin default</option></select></label>
  <label>Tile finish<select id="sFin"><option value="smooth">Smooth</option><option value="wood">Wood grain</option></select></label>
  <h4>Word list</h4>
  <label><input type="file" id="sFile" accept=".txt"></label>
  <small id="dictInfo"></small>
  <button id="sBuiltin">Use built-in ENABLE list</button>
  <button id="sClose">Close</button>
</div></div>

<script src="config.js"></script>
<script src="dev.js"></script>
<script>
const C = window.CONFIG, N = C.board.length, CELL = 40, BS = N * CELL, MID = N >> 1;
C.luck = Object.assign({ pairs: 0, pairChance: 10, vmin: 3, vmax: 4, vowelPct: 44, tierW: [1, 1, 1, 1], maxHigh: 8 }, C.luck || {});
C.dev = Object.assign({ confirmRestart: false, noSBlank: false }, C.dev || {});
C.tiers = C.tiers || { R: 1, S: 1, T: 1, N: 1, E: 1, A: 1, D: 2, G: 2, I: 2, L: 2, O: 2, U: 2, C: 2, M: 2, H: 2, B: 3, F: 3, P: 3, W: 3, Y: 3, K: 3, V: 3, J: 4, X: 4, Q: 4, Z: 4 };
const ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', VOW = 'AEIOU', DZ = { off: 0, low: .8, med: 1.0, high: 1.25 }, SMAX = 9;
const $ = id => document.getElementById(id);
const vp = $('vp'), board = $('board');
let S = { theme: 'slate', tiles: 'classic', fin: 'smooth', noRare: true, hBal: true, hDup: true, hHard: true, showBag: true,
          level: 'hard', first: 'random', lastFirst: 'computer', dz: 'med', skin: 'classic', lsz: 100, psz: 100, haptic: true, lite: false,
          scratch: true, sBest: false, dir: 'across' };
let G = null, selected = -1, busy = true, cur = null, msg = '', HL = null, SIM = null;
let view = { s: 1, x: 0, y: 0 }, fit = 1;
let W = new Set(), COMMON = new Set(), BAD = new Set(), root = {}, ownDict = false;
let SKIN = {}, SKINS = [{ id: 'classic', name: 'Classic' }];
const cells = [];
document.title = C.name; $('title').textContent = C.name;

const ico = p => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>';
const ICONS = {
  play: '<svg viewBox="0 0 24 24"><path d="M7 5v14l12-7z" fill="currentColor"/></svg>',

function pickTile(bag, tiles, left, f, L, ex) {

  const ok = (ch, lv) => {   // lv 0 = all rules, 1 = drop awkward, 2 = also relax pairs and balance, 3 = anything
    if (ex && ex.includes(ch)) return false;
    if (lv >= 3 || ch === '?') return true;
    const h = have[ch] || 0;
    if (f.dup) { if (h >= 2) return false; if (h === 1 && pairs >= L.pairs + extra + (lv >= 2 ? 1 : 0)) return false; }
    if (f.hard && lv < 1) {
      if ('JQXZV'.includes(ch) && hard >= 1) return false;

function genMoves(rack) {
  const cnt = {}; let blanks = 0;

          const m = [];
          lt.forEach((t, i) => m.push(o ? { r: a - lt.length + i, c: r, ch: t.ch, bl: t.bl } : { r, c: a - lt.length + i, ch: t.ch, bl: t.bl }));
          rt.forEach(t => m.push(o ? { r: t.c, c: r, ch: t.ch, bl: t.bl } : { r, c: t.c, ch: t.ch, bl: t.bl }));
          out.push(m);

        if (blanks > 0) { blanks--; lt.push({ ch, bl: 1 }); left(r, a, n[ch], lt, lim - 1); lt.pop(); blanks++; }
      }

    '<tr><td>Highest play</td><td>' + (bp ? bp.w + ' ' + bp.pts + ' (' + dt(bp.t) + ')' : '-') + '</td></tr>' +
    '<tr><td>Bingos</td><td>You ' + bi[0] + ' (' + (bi[0] / n).toFixed(2) + ' per game), Computer ' + bi[1] + '</td></tr></table>';
  const L = h.slice(-30), all = L.flatMap(g => [g.you, g.comp]), mn = Math.min(...all), mx = Math.max(...all), rg = Math.max(1, mx - mn);
  const pts = k => L.map((g, i) => (L.length > 1 ? 8 + i * 284 / (L.length - 1) : 150) + ',' + (84 - (g[k] - mn) / rg * 74)).join(' ');
  html += '<svg viewBox="0 0 300 94" width="100%"><polyline fill="none" stroke="#f5b942" stroke-width="2" points="' + pts('you') + '"/>' +
    '<polyline fill="none" stroke="#999" stroke-width="2" points="' + pts('comp') + '"/></svg><small>Scores over the last ' + L.length + ' games. Gold = you, grey = computer.</small><table>';
  h.slice(-10).reverse().forEach(g => { html += '<tr><td>' + dt(g.t) + '</td><td>' + g.you + ' - ' + g.comp + '</td><td>bingos ' + g.bingos[0] + '/' + g.bingos[1] + '</td><td>' + (g.best[0][1] ? g.best[0][0] + ' ' + g.best[0][1] : '') + '</td></tr>'; });
  b.innerHTML = html + '</table>'; $('stats').classList.add('on');
}


// ---------- buttons and settings ----------
function startNew() {
  newGame(); ['end', 'set', 'menu'].forEach(i => $(i).classList.remove('on')); busy = false; refresh();
  if (G.turn === 1) computerTurn();
}
$('bShuffle').onclick = shuffle;
$('bRecall').onclick = () => { if (!busy && !G.over) recallAll(); };
$('bFit').onclick = zoomFit;
$('bBag').onclick = showBag;
$('bagClose').onclick = () => $('bagv').classList.remove('on');
$('bMenu').onclick = () => { simUI(); $('menu').classList.add('on'); };
$('mClose').onclick = () => $('menu').classList.remove('on');
$('mNew').onclick = () => {
  if (SIM) { $('menu').classList.remove('on'); stopSim(); return; }
  if (!C.dev.confirmRestart || confirm('Cancel this game and start a new one? It will not be counted in your history.')) startNew();
};
$('mStats').onclick = () => { $('menu').classList.remove('on'); showStats(); };
$('statClose').onclick = () => $('stats').classList.remove('on');
$('statClear').onclick = () => { if (confirm('Clear all game history?')) { localStorage.removeItem(HK); showStats(); } };
$('mSet').onclick = () => {
  $('menu').classList.remove('on');
  $('sLsz').value = S.lsz; $('sPsz').value = S.psz; $('sTheme').value = S.theme; $('sTiles').value = S.tiles; $('sFin').value = S.fin; $('sSkin').value = S.skin;
  $('sRare').checked = S.noRare; $('hBal').checked = S.hBal; $('hDup').checked = S.hDup; $('hHard').checked = S.hHard; $('sBagOn').checked = S.showBag;
  $('sHap').checked = S.haptic; $('sLite').checked = S.lite; $('sScr').checked = S.scratch; $('sBest').checked = S.sBest;
  $('sLevel').value = S.level; $('sFirst').value = S.first; $('sDz').value = S.dz; $('set').classList.add('on');
};
$('sClose').onclick = () => $('set').classList.remove('on');
$('sLsz').oninput = e => { S.lsz = +e.target.value; applySettings(); save(); };
$('sPsz').oninput = e => { S.psz = +e.target.value; applySettings(); save(); };
$('sTheme').onchange = e => { S.theme = e.target.value; applySettings(); save(); };
$('sTiles').onchange = e => { S.tiles = e.target.value; applySettings(); save(); };
$('sFin').onchange = e => { S.fin = e.target.value; applySettings(); save(); };
$('sSkin').onchange = e => setSkin(e.target.value);
[['sRare', 'noRare'], ['hBal', 'hBal'], ['hDup', 'hDup'], ['hHard', 'hHard'], ['sBagOn', 'showBag'], ['sHap', 'haptic'], ['sLite', 'lite'], ['sScr', 'scratch'], ['sBest', 'sBest']].forEach(([id, k]) => {
  $(id).onchange = e => { S[k] = e.target.checked; applySettings(); scFeedback(); save(); };
});
[['sLevel', 'level'], ['sFirst', 'first'], ['sDz', 'dz']].forEach(([id, k]) => { $(id).onchange = e => { S[k] = e.target.value; save(); }; });
$('sFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const t = await f.text(); await idb(s => s.put(t, 'dict'));
  $('set').classList.remove('on'); await loadDict(); status(msg);
};
$('sBuiltin').onclick = async () => { await idb(s => s.delete('dict')); $('set').classList.remove('on'); await loadDict(); status(msg); };
$('endNew').onclick = () => { if (SIM) { stopSim(); return; } startNew(); };
$('endClose').onclick = () => { $('end').classList.remove('on'); if (SIM) stopSim(); };
const dirLabel = () => { $('bDir').textContent = S.dir === 'across' ? '\u2192 Across' : '\u2193 Down'; };
$('bDir').onclick = () => { S.dir = S.dir === 'across' ? 'down' : 'across'; dirLabel(); save(); };
function relayout() {
  const was = view.s <= fit * 1.01; fit = vp.clientWidth / BS;
  if (was) view.s = fit; view.s = Math.max(view.s, fit); apply();
}
function applySettings() {
  if (S.tiles === 'wood') S.tiles = 'honey';
  const b = document.body; b.className = 'th-' + S.theme + ' ts-' + S.tiles + ' fin-' + S.fin + (S.lite ? ' lite' : '') + (S.scratch ? '' : ' noscr');
  ['--tf1', '--tf2', '--th', '--te', '--tk', '--rx'].forEach(p => b.style.removeProperty(p));
  if (S.tiles === 'skin' && SKIN.tile) {   // a skin can supply its own tile colours
    const t = SKIN.tile, rad = parseFloat(t.radius || '10') * (String(t.radius || '').includes('%') ? 1 : 2.5);
    b.style.setProperty('--tf1', t.bg); b.style.setProperty('--tf2', t.bg); b.style.setProperty('--th', t.bg);
    b.style.setProperty('--te', t.border); b.style.setProperty('--tk', t.fg); b.style.setProperty('--rx', Math.min(50, rad) + 'px');
  }
  b.style.setProperty('--lsz', S.lsz / 100); b.style.setProperty('--psz', S.psz / 100);
  $('scr').style.display = S.scratch ? '' : 'none';
  $('bBag').style.display = S.showBag ? '' : 'none';
  document.querySelector('meta[name=theme-color]').content = getComputedStyle(b).getPropertyValue('--bg').trim() || '#252D38';
  dirLabel(); requestAnimationFrame(relayout);
}
window.addEventListener('resize', relayout);

// ---------- start ----------
load(); applySettings(); buildBoard();
document.querySelectorAll('[data-i]').forEach(e => { e.innerHTML = ICONS[e.dataset.i]; });
$('bagic').innerHTML = ICONS.bag;
const logoTile = tileEl({ ch: 'W' }); $('logo').appendChild(logoTile);
fit = vp.clientWidth / BS; view.s = fit; apply();
if (!G) newGame();
window.BW = window.BW || {}; window.BW.startSim = startSim;
render(); evaluate();
loadSkins(); loadDict();
if ('serviceWorker' in navigator) {
  const had = navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had) location.reload(); });
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

</script>
